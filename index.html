<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flugauswertung</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.6/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="auth-section">
    <form id="login-form">
      <h2>Login</h2>
      <input type="email" id="login-email" placeholder="E-Mail" required />
      <input type="password" id="login-password" placeholder="Passwort" required />
      <button type="submit">Login</button>
    </form>

    <form id="signup-form">
      <h2>Registrieren</h2>
      <input type="email" id="signup-email" placeholder="E-Mail" required />
      <input type="password" id="signup-password" placeholder="Passwort" required />
      <button type="submit">Registrieren</button>
    </form>
  </div>

  <div id="app-section" style="display:none">
    <button id="logout-btn">Logout</button>

    <h2>Excel-Datei hochladen</h2>
    <input type="file" id="excel-file" accept=".xlsx"/>
    <button id="upload-btn">Hochladen</button>
    <p id="upload-status"></p>

    <h2>Flugauswertung</h2>
    <label for="jahr-auswahl">Jahr:</label>
    <select id="jahr-auswahl"></select>

    <p><strong>Meistgeflogenes Flugzeug:</strong> <span id="most-flown">–</span></p>
    <p><strong>Längste Flugzeit:</strong> <span id="longest-time">–</span></p>

    <canvas id="flughaeufigkeit-chart" width="400" height="300"></canvas>
    <canvas id="flugzeit-chart" width="400" height="300"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
