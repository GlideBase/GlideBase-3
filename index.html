<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlideBase – Flugupload</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.6"></script>
</head>
<body>
  <header>
    <h1>Flugdaten hochladen</h1>
    <p>Lade deine Excel-Datei hoch (.xlsx) mit Spalten: Datum, Flugzeug, Start, Landung, Flugzeit</p>
  </header>

  <main class="container">
    <input type="file" id="excel-file" accept=".xlsx" />
    <button id="upload-btn">Upload starten</button>
    <div id="upload-status"></div>

    <section class="auswertung">
      <h2>Auswertung</h2>
      <button id="load-analysis">Aktualisieren</button>
      <p><strong>Meistgeflogenes Flugzeug:</strong> <span id="most-flown"></span></p>
      <p><strong>Längste Flugzeit:</strong> <span id="longest-time"></span></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
